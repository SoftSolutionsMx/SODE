{% extends "users_app/base.html" %}
{% block title %}Iniciar sesión | SODE{% endblock %}
{% block content %}
<section class="mx-auto my-8 max-w-lg rounded-2xl border border-slate-800 bg-slate-900 p-6 sm:p-10">
  <p class="text-sm font-semibold uppercase tracking-widest text-indigo-300">Bienvenido de nuevo</p>
  <h1 class="mt-2 text-3xl font-bold text-white">Iniciar sesión</h1>
  <form class="mt-8" method="post" novalidate>
    {% csrf_token %}{{ form.as_p }}
    <button class="mt-2 rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white hover:bg-indigo-500" type="submit">Iniciar sesión</button>
  </form>
  <p class="mt-6 text-slate-400">¿Aún no tienes cuenta? <a class="text-indigo-300 hover:text-indigo-200" href="{% url 'assistant_signup' %}">Regístrate como asistente</a> o <a class="text-indigo-300 hover:text-indigo-200" href="{% url 'organizer_signup' %}">como organizador</a>.</p>
</section>
{% endblock %}
