<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SODE{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <header class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-5">
    <a class="text-xl font-extrabold tracking-[.2em] text-white" href="{% url 'home' %}">SODE</a>
    <nav class="flex flex-wrap items-center gap-4" aria-label="Navegación principal">
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Mi perfil</a>
        <form method="post" action="{% url 'account_logout' %}">
          {% csrf_token %}<button class="rounded-lg bg-slate-700 px-4 py-2 font-medium text-white hover:bg-slate-600" type="submit">Cerrar sesión</button>
        </form>
      {% else %}
        <a href="{% url 'account_login' %}">Iniciar sesión</a>
      {% endif %}
    </nav>
  </header>
  <main class="mx-auto max-w-6xl px-4">
    {% for message in messages %}<p class="my-4 rounded-lg bg-emerald-950 px-4 py-3 text-emerald-200" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
